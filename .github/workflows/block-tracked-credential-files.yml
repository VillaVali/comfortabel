name: Block tracked local credentials
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  tracked-credential-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (no secrets)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject tracked local credential files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z | grep -zEq '(^|/)(\.project-config\.json|\.env(\.[^/]*)?|id_rsa|id_ed25519|[^/]+\.(pem|p12|pfx))$'; then
            echo "::error::A credential or local configuration file is tracked. Remove it from the Git index and rotate any exposed credentials."
            exit 1
          fi
          echo "Tracked local credential filename check passed."
